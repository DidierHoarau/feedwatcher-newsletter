     bgcolor header, inline colors/borders/padding and remote images. No real
     recipient, token or personal data. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCMP</title>
</head>
<body style="margin:0;padding:0;background:#ececec">
<table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ececec">

    <td align="center" valign="top" style="padding:12px 0">
      <table width="720" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" align="center">
        <tr>

            <font face="Helvetica, Arial, sans-serif" color="#ffffff" size="5">SCMP Newsletter</font>
          </td>
        </tr>
        <tr>
          <td colspan="2" align="left" valign="top" style="padding:20px 20px 0;border-bottom:2px solid #b30000">

              <tr>

                    </tr>
                    <tr>

                        A reduced summary paragraph for the lead story, with no real names or figures.
                      </td>
                    </tr>
                    <tr>
                      <td align="left" valign="top">
                        <img src="https://media.example.com/scmp/lead.jpg" width="360" height="200" alt="Lead story" style="display:block;width:360px;height:200px;border:1px solid #dddddd">

                    </tr>

                </td>

                  <table width="100%" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td align="left" style="color:#b30000;font-family:Helvetica, Arial, sans-serif;font-size:13px;font-weight:bold;letter-spacing:1px;padding:0 0 8px">

                    </tr>
                    <tr>
                      <td align="left" valign="top" style="padding:0 0 12px;font-family:Helvetica, Arial, sans-serif;font-size:14px;line-height:20px;color:#333333">

                    <tr>
                      <td align="left" valign="top" style="padding:0 0 12px;font-family:Helvetica, Arial, sans-serif;font-size:14px;line-height:20px;color:#333333">
                        <a href="https://example.com/scmp/b" style="color:#1a4a8a;text-decoration:none">Reduced secondary headline B</a>
                      </td>
                    </tr>
                    <tr>
                      <td align="left" valign="top" style="padding:8px 0 0;border-top:1px dotted #cccccc">

                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>

        <tr>
          <td colspan="2" align="center" valign="middle" style="padding:16px 20px;background-color:#f5f5f5;font-family:Helvetica, Arial, sans-serif;font-size:12px;color:#777777">

              <font face="Helvetica" color="#777777" size="2">Reduced fixture · no real editorial content</font>
            </center>

        </tr>

    </td>
